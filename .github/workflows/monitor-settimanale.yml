name: Monitor settimanale ENEA V2

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica i file del repository
        uses: actions/checkout@v4

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Installa le librerie
        run: pip install -r requirements.txt

      - name: Esegui la ricerca eventi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py

      - name: Salva il Markdown come artifact scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: report-eventi-${{ github.run_number }}
          path: output/
          retention-days: 90

      - name: Pubblica il report come Job Summary
        run: cat output/*.md >> $GITHUB_STEP_SUMMARY
